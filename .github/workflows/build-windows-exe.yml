name: build-windows-exe

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag that contains FlsConverter_package zip'
        required: true
        default: 'fls-package-v0.1.0'
      release_asset_name:
        description: 'Release asset name for FlsConverter_package zip'
        required: true
        default: 'FlsConverter_package.zip'
      app_name:
        description: 'Output application folder name'
        required: false
        default: 'facadeDetection'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      FLS_CONVERTER_DLL_DIR: ${{ github.workspace }}\FlsConverter_package\FlsConverter
      APP_NAME: ${{ inputs.app_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GitHub CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw 'GitHub CLI (gh) is not available on the windows-latest runner.'
          }
          gh --version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      - name: Download FlsConverter_package from GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_ASSET_NAME: ${{ inputs.release_asset_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'external'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zipPath = Join-Path $outDir $env:RELEASE_ASSET_NAME
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:RELEASE_ASSET_NAME `
            --dir $outDir
          if (-not (Test-Path $zipPath)) {
            throw "Release asset not found: $zipPath. Check release_tag and release_asset_name inputs."
          }

      - name: Extract FlsConverter_package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "external\${{ inputs.release_asset_name }}"
          $extractRoot = Join-Path $env:GITHUB_WORKSPACE 'FlsConverter_package'
          if (Test-Path $extractRoot) { Remove-Item -Recurse -Force $extractRoot }
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force
          $expected = Join-Path $extractRoot 'FlsConverter'
          if (Test-Path (Join-Path $expected 'FlsConverter.pyd')) {
            Write-Host "FlsConverter directory ready: $expected"
          } else {
            $nested = Get-ChildItem $extractRoot -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'FlsConverter.pyd') } | Select-Object -First 1
            if ($nested) {
              if (Test-Path $expected) { Remove-Item -Recurse -Force $expected }
              Move-Item $nested.FullName $expected
            }
          }
          if (-not (Test-Path (Join-Path $expected 'FlsConverter.pyd'))) {
            throw 'FlsConverter.pyd not found after extraction.'
          }

      - name: Install project dependencies
        run: |
          python -m pip install -r facadeDetection/requirements.txt

      - name: Smoke test imports and converter path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import os
          from pathlib import Path
          os.environ['FLS_CONVERTER_DLL_DIR'] = str(Path.cwd() / 'FlsConverter_package' / 'FlsConverter')
          import facadeDetection.main as app_main
          from facadeDetection.utils.convert_fls2ply import _load_pybind_converter
          converter = _load_pybind_converter()
          print('FlsConverter import OK:', converter)
          '@ | python -

      - name: Build executable with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          pyinstaller packaging/facadeDetection.spec --noconfirm

      - name: Package output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distRoot = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $packageName = "${env:APP_NAME}-windows-py312"
          $zipPath = Join-Path $distRoot "$packageName.zip"
          if (Test-Path $zipPath) { Remove-Item -Recurse -Force $zipPath }
          Compress-Archive -Path (Join-Path $distRoot $env:APP_NAME) -DestinationPath $zipPath -Force
          Get-ChildItem $distRoot

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: facadeDetection-windows-py312
          path: dist/*.zip
          if-no-files-found: error