<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大规模点云可视化与配准系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-panel: rgba(20, 20, 40, 0.92);
            --border-color: rgba(100, 100, 200, 0.25);
            --accent: #667eea;
            --accent-hover: #764ba2;
            --text-primary: #e0e0ff;
            --text-secondary: #8892b0;
            --success: #48bb78;
            --warning: #ed8936;
            --danger: #f56565;
            --info: #4299e1;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        #app {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ============================
                   左侧边栏
                   ============================ */
        #sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        }

        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .sidebar-header p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .sidebar-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* -------- 上传区域 -------- */
        .upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(102, 126, 234, 0.03);
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(102, 126, 234, 0.08);
            transform: translateY(-2px);
        }

        .upload-zone .icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.7;
        }

        .upload-zone p {
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .upload-zone .hint {
            font-size: 12px;
            color: var(--text-secondary);
        }

        input[type="file"] {
            display: none;
        }

        /* -------- 参数滑块 -------- */
        .param-group {
            margin-bottom: 12px;
        }

        .param-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .param-group input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-primary);
            outline: none;
        }

        .param-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(102, 126, 234, 0.4);
        }

        .param-value {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .param-value span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .param-value .value {
            color: var(--accent);
            font-weight: 600;
            font-family: monospace;
        }

        /* -------- 按钮 -------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent);
        }

        .btn-danger {
            background: rgba(245, 101, 101, 0.15);
            color: var(--danger);
            border: 1px solid rgba(245, 101, 101, 0.3);
        }

        .btn-danger:hover:not(:disabled) {
            background: rgba(245, 101, 101, 0.25);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.active {
            background: linear-gradient(135deg, var(--success), #38a169);
            color: white;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn-row .btn {
            flex: 1;
            margin-bottom: 0;
        }

        /* -------- 文件列表 -------- */
        .file-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .file-item.active {
            border-color: var(--accent);
            background: rgba(102, 126, 234, 0.1);
        }

        .file-item .file-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .file-item .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-item .file-name {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item .file-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .file-item .file-remove {
            opacity: 0;
            transition: opacity 0.2s;
            cursor: pointer;
            color: var(--danger);
            font-size: 16px;
        }

        .file-item:hover .file-remove {
            opacity: 1;
        }

        /* -------- 状态栏 -------- */
        .status-bar {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            min-height: 44px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-bar.loading {
            color: var(--info);
        }
        .status-bar.success {
            color: var(--success);
        }
        .status-bar.error {
            color: var(--danger);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* -------- 3D 视口 -------- */
        #viewport {
            flex: 1;
            position: relative;
            background: var(--bg-primary);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        /* -------- 悬浮工具栏 -------- */
        .toolbar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: var(--bg-panel);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .toolbar-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toolbar-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        .toolbar-btn.active {
            background: var(--accent);
            color: white;
        }

        .toolbar-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .toolbar-divider {
            width: 1px;
            background: var(--border-color);
            margin: 4px 0;
        }

        /* -------- 信息面板 -------- */
        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(12px);
            z-index: 100;
            max-height: 70vh;
            overflow-y: auto;
        }

        .info-panel h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 500;
            font-family: monospace;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
        }

        .selected-info {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .selected-info.show {
            display: block;
        }

        /* -------- 颜色编辑器 -------- */
        .color-editor {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
        }

        .color-editor input[type="color"] {
            width: 40px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
        }

        .color-presets {
            display: flex;
            gap: 4px;
        }

        .color-preset {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .color-preset:hover {
            transform: scale(1.1);
            border-color: white;
        }

        /* -------- 底部状态 -------- */
        .bottom-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .fps-counter {
            background: var(--bg-panel);
            padding: 6px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: var(--success);
            border: 1px solid var(--border-color);
            pointer-events: auto;
        }

        .hint-text {
            background: var(--bg-panel);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            pointer-events: auto;
        }

        /* -------- 进度遮罩 -------- */
        .progress-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .progress-overlay.show {
            display: flex;
        }

        .progress-card {
            background: var(--bg-secondary);
            padding: 32px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            text-align: center;
            min-width: 300px;
        }

        .progress-card h3 {
            margin-bottom: 20px;
            font-size: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-primary);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-hover));
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        .progress-text {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* -------- 滚动条 -------- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* -------- 提示框 -------- */
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            display: none;
            border: 1px solid var(--border-color);
        }

        /* -------- 响应式 -------- */
        @media (max-width: 900px) {
            #sidebar {
                width: 280px;
                min-width: 280px;
            }
            .info-panel {
                width: 220px;
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================================
    HTML 结构
    ========================================================== -->
<div id="app">
    <aside id="sidebar">
        <div class="sidebar-header">
            <h1>☁️ 点云可视化</h1>
            <p>大规模点云处理与配准</p>
        </div>
        <div class="sidebar-content">
            <!-- 上传 -->
            <div class="sidebar-section">
                <div class="section-title">📁 文件上传</div>
                <div class="upload-zone" id="drop-zone">
                    <div class="icon">📂</div>
                    <p>拖拽 PLY 文件到此处</p>
                    <p class="hint">支持多文件同时上传</p>
                </div>
                <input type="file" id="file-input" accept=".ply" multiple />
            </div>

            <!-- 参数 -->
            <div class="sidebar-section">
                <div class="section-title">⚙️ 处理参数</div>
                <div class="param-group">
                    <label>体素下采样大小</label>
                    <input type="range" id="voxel-size" min="0" max="1" step="0.01" value="0.05" />
                    <div class="param-value"><span>精细</span><span class="value" id="voxel-value">0.05</span><span>粗略</span></div>
                </div>
                <div class="param-group">
                    <label>点大小缩放</label>
                    <input type="range" id="point-size" min="0.01" max="5" step="0.01" value="1.0" />
                    <div class="param-value"><span>小</span><span class="value" id="point-size-value">1.0</span><span>大</span></div>
                </div>
            </div>

            <!-- 文件列表 -->
            <div class="sidebar-section">
                <div class="section-title">📋 文件列表</div>
                <div class="file-list" id="file-list">
                    <div style="text-align:center; color:var(--text-secondary); font-size:12px; padding:20px;">暂无文件，请上传</div>
                </div>
            </div>

            <!-- 基本操作 -->
            <div class="sidebar-section">
                <div class="section-title">🔧 处理操作</div>
                <button class="btn btn-secondary" id="btn-denoise" disabled>🧹 去噪处理</button>
                <button class="btn btn-secondary" id="btn-normals" disabled>📐 计算法向量</button>
                <button class="btn btn-secondary" id="btn-bbox" disabled>📦 显示边界框</button>
                <button class="btn btn-secondary" id="btn-save-reg" disabled>💾 保存配准结果</button>
                <div class="btn-row">
                    <button class="btn btn-danger" id="btn-clear" disabled>🗑️ 清空</button>
                    <button class="btn btn-secondary" id="btn-reset-view">🎯 重置视角</button>
                </div>
            </div>

            <!-- 颜色 -->
            <div class="sidebar-section">
                <div class="section-title">🎨 颜色设置</div>
                <div class="color-editor">
                    <input type="color" id="color-picker" value="#667eea" />
                    <div class="color-presets" id="color-presets">
                        <div class="color-preset" style="background:#667eea;" data-color="#667eea"></div>
                        <div class="color-preset" style="background:#f56565;" data-color="#f56565"></div>
                        <div class="color-preset" style="background:#48bb78;" data-color="#48bb78"></div>
                        <div class="color-preset" style="background:#ed8936;" data-color="#ed8936"></div>
                        <div class="color-preset" style="background:#38b2ac;" data-color="#38b2ac"></div>
                        <div class="color-preset" style="background:#9f7aea;" data-color="#9f7aea"></div>
                    </div>
                </div>
                <button class="btn btn-secondary" id="btn-apply-color" style="margin-top:8px;" disabled>✨ 应用颜色</button>
                <button class="btn btn-secondary" id="btn-reset-color" style="margin-top:4px;" disabled>↩️ 恢复原始颜色</button>
            </div>

            <!-- 配准控制 -->
            <div class="sidebar-section">
                <div class="section-title">🔗 点云配准</div>
                <div class="btn-row">
                    <button class="btn btn-secondary" id="btn-set-target" disabled>🎯 设为目标</button>
                    <button class="btn btn-secondary" id="btn-set-source" disabled>📌 设为源</button>
                </div>
                <div class="btn-row">
                    <button class="btn btn-secondary" id="btn-reg-mode" disabled>✏️ 进入配准</button>
                    <button class="btn btn-danger" id="btn-exit-reg" disabled>🚪 退出配准</button>
                </div>
                <div class="btn-row">
                    <button class="btn btn-secondary" id="btn-add-correspondence" disabled>➕ 添加点对</button>
                    <button class="btn btn-secondary" id="btn-undo-correspondence" disabled>↩️ 撤销点对</button>
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" id="btn-execute-reg" disabled>⚡ 执行配准</button>
                    <button class="btn btn-secondary" id="btn-icp-refine" disabled>🔧 ICP精配准</button>
                </div>
                <div style="margin-top:8px; font-size:12px; color:var(--text-secondary);" id="reg-status">
                    对应点: 0 对 | 源: 未选 | 目标: 未选
                </div>
            </div>
        </div>
        <div class="status-bar" id="status-bar"><span>就绪</span></div>
    </aside>

    <main id="viewport">
        <div id="canvas-container"></div>
        <div class="toolbar">
            <button class="toolbar-btn active" id="tb-rotate" title="旋转 (R)">🔄</button>
            <button class="toolbar-btn" id="tb-pan" title="平移 (P)">✋</button>
            <button class="toolbar-btn" id="tb-zoom" title="缩放 (Z)">🔍</button>
            <div class="toolbar-divider"></div>
            <button class="toolbar-btn active" id="tb-grid" title="切换网格 (G)">⊞</button>
            <button class="toolbar-btn active" id="tb-axes" title="切换坐标轴 (A)">📍</button>
            <div class="toolbar-divider"></div>
            <button class="toolbar-btn" id="tb-screenshot" title="截图 (C)">📷</button>
            <button class="toolbar-btn" id="tb-fullscreen" title="全屏 (F)">⛶</button>
        </div>

        <div class="info-panel" id="info-panel">
            <h3>📊 场景信息</h3>
            <div class="info-row"><span class="info-label">文件</span><span class="info-value" id="info-filename">-</span></div>
            <div class="info-row"><span class="info-label">点数</span><span class="info-value" id="info-points">-</span></div>
            <div class="info-row"><span class="info-label">边界框</span><span class="info-value" id="info-bbox">-</span></div>
            <div class="info-row"><span class="info-label">中心</span><span class="info-value" id="info-center">-</span></div>
            <div class="info-row"><span class="info-label">场景范围</span><span class="info-value" id="info-range">-</span></div>
        </div>

        <div class="bottom-bar">
            <div class="fps-counter" id="fps-counter">FPS: 60</div>
            <div class="hint-text" id="hint-text">鼠标左键旋转 | 右键平移 | 滚轮缩放</div>
        </div>

        <div class="progress-overlay" id="progress-overlay">
            <div class="progress-card">
                <h3 id="progress-title">处理中...</h3>
                <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="progress-text" id="progress-text">请稍候...</div>
            </div>
        </div>
    </main>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
// ============================================================
// 导入
// ============================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- 后端 API（同源，页面由 Flask 提供） ----------
const API_BASE = '';

// ---------- 配置 ----------
const CONFIG = {
    BASE_POINT_SIZE: 0.5,
    NORMAL_LENGTH: 0.5,
    NORMAL_COLOR: 0x00ff88,
    REG_MARKER_SIZE: 0.5,
    FPS_INTERVAL: 500,
};

// ============================================================
// 坐标转换工具
// ============================================================
function convertZupToYup(positions) {
    const count = positions.length / 3;
    const out = new Float32Array(positions.length);
    for (let i = 0; i < count; i++) {
        const x = positions[i*3], y = positions[i*3+1], z = positions[i*3+2];
        out[i*3] = x;
        out[i*3+1] = z;
        out[i*3+2] = -y;
    }
    return out;
}
function convertZupToYupSingle(pointZ) {
    return new THREE.Vector3(pointZ[0], pointZ[2], -pointZ[1]);
}
function convertZupToYupNormals(normals) {
    const count = normals.length / 3;
    const out = new Float32Array(normals.length);
    for (let i = 0; i < count; i++) {
        const nx = normals[i*3], ny = normals[i*3+1], nz = normals[i*3+2];
        out[i*3] = nx;
        out[i*3+1] = nz;
        out[i*3+2] = -ny;
    }
    return out;
}

// ============================================================
// 二进制点云协议
// 布局（小端）: [uint32 头长度][JSON头(4字节对齐)]
//              [positions f32][normals f32(可选)][colors u8]
// ============================================================
function parseBinaryCloud(buffer) {
    const headerLen = new DataView(buffer).getUint32(0, true);
    const meta = JSON.parse(new TextDecoder().decode(new Uint8Array(buffer, 4, headerLen)));
    const n = meta.point_count;
    let offset = 4 + headerLen;

    const positions = new Float32Array(buffer, offset, n * 3);
    offset += n * 12;

    let normals;
    if (meta.has_normals) {
        normals = new Float32Array(buffer, offset, n * 3);
        offset += n * 12;
    } else {
        normals = new Float32Array(n * 3);
    }

    const colorsU8 = new Uint8Array(buffer, offset, n * 3);
    const colors = new Float32Array(n * 3);
    for (let i = 0; i < n * 3; i++) colors[i] = colorsU8[i] / 255;

    return { meta, positions, colors, normals };
}

async function fetchCloud(url, options) {
    const resp = await fetch(url, options);
    const contentType = resp.headers.get('Content-Type') || '';
    if (contentType.includes('application/json')) {
        const result = await resp.json();
        throw new Error(result.error || `请求失败 (${resp.status})`);
    }
    if (!resp.ok) throw new Error(`请求失败 (${resp.status})`);
    return parseBinaryCloud(await resp.arrayBuffer());
}

function initScene() {
    const container = document.getElementById('canvas-container');
    state.scene = new THREE.Scene();
    state.scene.background = new THREE.Color(0x0a0a1a);

    const aspect = container.clientWidth / container.clientHeight;
    state.camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 50000);
    state.camera.position.set(100, 100, 100);

    state.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    state.renderer.setSize(container.clientWidth, container.clientHeight);
    state.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(state.renderer.domElement);

    state.controls = new OrbitControls(state.camera, state.renderer.domElement);
    state.controls.enableDamping = true;
    state.controls.dampingFactor = 0.05;
    state.controls.screenSpacePanning = true;
    state.controls.minDistance = 0.1;
    state.controls.maxDistance = 20000;

    state.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(50, 50, 50);
    state.scene.add(dirLight);

    state.gridHelper = new THREE.GridHelper(1000, 100, 0x444466, 0x222244);
    state.scene.add(state.gridHelper);
    state.axesHelper = new THREE.AxesHelper(50);
    state.scene.add(state.axesHelper);

    // 保存初始相机状态
    saveCameraState();

    bindEvents();
    animate();
    updateToolbarState();
}

// ============================================================
// 相机状态持久化
// ============================================================
function saveCameraState() {
    if (state.camera && state.controls) {
        state.cameraState.position = state.camera.position.clone();
        state.cameraState.target = state.controls.target.clone();
    }
}
function restoreCameraState() {
    if (state.cameraState.position && state.cameraState.target) {
        state.camera.position.copy(state.cameraState.position);
        state.controls.target.copy(state.cameraState.target);
        state.controls.update();
    }
}

// ============================================================
// 更新场景尺度
// ============================================================
function updateSceneScale() {
    const range = state.sceneRange;
    if (state.gridHelper) state.scene.remove(state.gridHelper);
    state.gridHelper = new THREE.GridHelper(range * 2, 50, 0x444466, 0x222244);
    state.scene.add(state.gridHelper);
    if (state.axesHelper) state.scene.remove(state.axesHelper);
    state.axesHelper = new THREE.AxesHelper(range * 0.1);
    state.scene.add(state.axesHelper);
}

// ============================================================
// 加载点云（复用Mesh，保留视角）
// ============================================================
async function loadPointCloud(data, filename, uuid, updateOnly = false) {
    const { positions, colors, normals } = data;
    const pointCount = positions.length / 3;

    const posY = convertZupToYup(positions);
    const normY = convertZupToYupNormals(normals);
    const col = colors instanceof Float32Array ? colors : new Float32Array(colors);

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(posY, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geometry.setAttribute('normal', new THREE.BufferAttribute(normY, 3));
    geometry.computeBoundingBox();
    const bbox = geometry.boundingBox.clone();
    const center = new THREE.Vector3();
    bbox.getCenter(center);
    const size = new THREE.Vector3();
    bbox.getSize(size);
    const adaptiveSize = computeAdaptivePointSize(size);

    // 如果已经存在该UUID，则更新几何和材质（保留Mesh对象）
    let cloudEntry = state.pointClouds.get(uuid);
    if (cloudEntry) {
        // 复用现有Mesh
        const mesh = cloudEntry.mesh;
        mesh.geometry.dispose();
        mesh.geometry = geometry;
        mesh.material.size = adaptiveSize * state.pointSizeScale;
        // 更新数据
        cloudEntry.geometry = geometry;
        cloudEntry.pointCount = pointCount;
        cloudEntry.center = center;
        cloudEntry.bbox = bbox;
        cloudEntry.adaptiveSize = adaptiveSize;
        cloudEntry.originalColors = new Float32Array(col);
        // 如果是激活的，更新信息
        if (state.activeCloud && state.activeCloud.uuid === uuid) {
            updateInfoPanel(cloudEntry);
        }
        return;
    }

    // 新建
    const material = new THREE.PointsMaterial({
        size: adaptiveSize * state.pointSizeScale,
        vertexColors: true,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.9,
    });
    const mesh = new THREE.Points(geometry, material);
    mesh.frustumCulled = false;
    state.scene.add(mesh);

    cloudEntry = {
        mesh,
        geometry,
        filename,
        uuid,
        originalColors: new Float32Array(col),
        pointCount,
        center: center.clone(),
        bbox: bbox.clone(),
        adaptiveSize,
    };
    state.pointClouds.set(uuid, cloudEntry);

    // 更新场景范围
    const maxDim = Math.max(size.x, size.y, size.z);
    if (maxDim > state.sceneRange) {
        state.sceneRange = maxDim;
        updateSceneScale();
    }

    setActiveCloud(uuid);
}

function computeAdaptivePointSize(bboxSize) {
    const maxDim = Math.max(bboxSize.x, bboxSize.y, bboxSize.z);
    if (maxDim > 1000) return 0.3;
    if (maxDim > 100) return 0.5;
    if (maxDim > 10) return 1.0;
    return 2.0;
}

function updateInfoPanel(cloud) {
    document.getElementById('info-filename').textContent = cloud.filename;
    document.getElementById('info-points').textContent = cloud.pointCount.toLocaleString();
    const size = new THREE.Vector3();
    cloud.bbox.getSize(size);
    document.getElementById('info-bbox').textContent =
        `${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)}`;
    document.getElementById('info-center').textContent =
        `${cloud.center.x.toFixed(1)}, ${cloud.center.y.toFixed(1)}, ${cloud.center.z.toFixed(1)}`;
    document.getElementById('info-range').textContent = `${state.sceneRange.toFixed(1)}`;
}

function setActiveCloud(uuid, focus = false) {
    document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
    const activeEl = document.querySelector(`[data-uuid="${uuid}"]`);
    if (activeEl) activeEl.classList.add('active');

    state.activeCloud = state.pointClouds.get(uuid);
    if (!state.activeCloud) return;

    updateInfoPanel(state.activeCloud);
    updateButtonState(true);

    if (focus) focusOnCloud(uuid);
}

function focusOnCloud(uuid) {
    const cloud = state.pointClouds.get(uuid);
    if (!cloud) return;
    const center = cloud.center;
    const size = new THREE.Vector3();
    cloud.bbox.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z);
    const distance = maxDim * 1.5;
    const endPos = center.clone().add(new THREE.Vector3(distance, distance * 0.8, distance));
    state.camera.position.copy(endPos);
    state.controls.target.copy(center);
    state.controls.update();
    saveCameraState();
}

// ============================================================
// 文件上传
// ============================================================
async function uploadFiles(files) {
    const voxelSize = document.getElementById('voxel-size').value;
    showProgress('上传处理中...', 0);
    const fileArr = Array.from(files);
    let successCount = 0;
    for (let i = 0; i < fileArr.length; i++) {
        const file = fileArr[i];
        try {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('voxel_size', voxelSize);
            const parsed = await fetchCloud(`${API_BASE}/upload`, { method: 'POST', body: formData });
            await loadPointCloud(parsed, parsed.meta.filename, parsed.meta.uuid);
            addFileToList(parsed.meta.filename, parsed.meta.uuid, parsed.meta.point_count);
            successCount++;
        } catch (err) {
            showStatus(`文件 ${file.name} 失败: ${err.message}`, 'error');
        }
        updateProgress(((i + 1) / fileArr.length) * 100);
    }
    hideProgress();
    if (successCount > 0) showStatus(`成功加载 ${successCount} 个文件`, 'success');
    // 恢复视角
    restoreCameraState();
}

function addFileToList(filename, uuid, pointCount) {
    const list = document.getElementById('file-list');
    if (list.children.length === 1 && list.children[0].textContent.includes('暂无文件')) list.innerHTML = '';
    const item = document.createElement('div');
    item.className = 'file-item';
    item.dataset.uuid = uuid;
    item.innerHTML = `
        <div class="file-icon">📄</div>
        <div class="file-info">
            <div class="file-name" title="${filename}">${filename}</div>
            <div class="file-meta">${pointCount.toLocaleString()} 点</div>
        </div>
        <div class="file-remove" data-uuid="${uuid}">✕</div>
    `;
    item.addEventListener('click', (e) => {
        if (e.target.classList.contains('file-remove')) {
            e.stopPropagation();
            removeCloud(uuid);
            item.remove();
            if (list.children.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:var(--text-secondary);font-size:12px;padding:20px;">暂无文件，请上传</div>';
            }
        } else {
            setActiveCloud(uuid, true);
        }
    });
    list.appendChild(item);
}

function removeCloud(uuid) {
    const cloud = state.pointClouds.get(uuid);
    if (!cloud) return;
    state.scene.remove(cloud.mesh);
    cloud.geometry.dispose();
    cloud.mesh.material.dispose();
    state.pointClouds.delete(uuid);
    if (state.activeCloud?.uuid === uuid) {
        state.activeCloud = null;
        updateButtonState(false);
        document.getElementById('info-filename').textContent = '-';
        document.getElementById('info-points').textContent = '-';
        document.getElementById('info-bbox').textContent = '-';
        document.getElementById('info-center').textContent = '-';
        document.getElementById('info-range').textContent = '-';
    }
    if (state.reg.sourceUUID === uuid) state.reg.sourceUUID = null;
    if (state.reg.targetUUID === uuid) state.reg.targetUUID = null;
    updateRegStatus();
}

function clearAll() {
    for (const [uuid] of state.pointClouds) removeCloud(uuid);
    state.pointClouds.clear();
    document.getElementById('file-list').innerHTML = '<div style="text-align:center;color:var(--text-secondary);font-size:12px;padding:20px;">暂无文件，请上传</div>';
    if (state.bboxHelper) { state.scene.remove(state.bboxHelper); state.bboxHelper = null; }
    state.sceneRange = 100;
    updateSceneScale();
    updateButtonState(false);
    clearRegistration();
    showStatus('已清空所有点云', 'success');
}

// ============================================================
// 后端操作
// ============================================================
async function denoise() {
    if (!state.activeCloud) return;
    const { uuid, filename } = state.activeCloud;
    const voxelSize = document.getElementById('voxel-size').value;
    showProgress('去噪中...', 0);
    try {
        const parsed = await fetchCloud(`${API_BASE}/denoise`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uuid, voxel_size: parseFloat(voxelSize) }),
        });
        // 更新现有点云
        await loadPointCloud(parsed, filename, parsed.meta.uuid);
        showStatus('去噪完成', 'success');
    } catch (err) {
        showStatus(`去噪失败: ${err.message}`, 'error');
    } finally { hideProgress(); }
}

async function computeNormals() {
    if (!state.activeCloud) return;
    const { uuid } = state.activeCloud;
    const voxelSize = document.getElementById('voxel-size').value;
    showProgress('计算法向量...', 0);
    try {
        const parsed = await fetchCloud(`${API_BASE}/compute_normals`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uuid, voxel_size: parseFloat(voxelSize) }),
        });
        // 后端会重新下采样，点数可能变化，因此整体重载几何而非只替换法向量
        await loadPointCloud(parsed, parsed.meta.filename, uuid);
        if (state.showNormals) {
            hideNormals();
            showNormals();
        }
        showStatus('法向量计算完成', 'success');
    } catch (err) {
        showStatus(`计算失败: ${err.message}`, 'error');
    } finally { hideProgress(); }
}

async function computeBoundingBox() {
    if (!state.activeCloud) return;
    const { uuid } = state.activeCloud;
    try {
        const resp = await fetch(`${API_BASE}/boundingbox`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uuid }),
        });
        const result = await resp.json();
        if (result.error) throw new Error(result.error);
        const minZ = new THREE.Vector3(result.min[0], result.min[1], result.min[2]);
        const maxZ = new THREE.Vector3(result.max[0], result.max[1], result.max[2]);
        const minY = convertZupToYupSingle(minZ);
        const maxY = convertZupToYupSingle(maxZ);
        const box = new THREE.Box3(minY, maxY);
        if (state.bboxHelper) state.scene.remove(state.bboxHelper);
        state.bboxHelper = new THREE.Box3Helper(box, 0xffaa00);
        state.bboxHelper.visible = state.showBbox;
        state.scene.add(state.bboxHelper);
        state.showBbox = true;
        document.getElementById('btn-bbox').classList.add('active');
        showStatus('边界框计算完成', 'success');
    } catch (err) {
        showStatus(`计算失败: ${err.message}`, 'error');
    }
}

function toggleBoundingBox() {
    if (!state.bboxHelper && state.activeCloud) {
        computeBoundingBox();
        return;
    }
    state.showBbox = !state.showBbox;
    if (state.bboxHelper) state.bboxHelper.visible = state.showBbox;
    document.getElementById('btn-bbox').classList.toggle('active', state.showBbox);
}

function toggleNormals() {
    if (!state.activeCloud) return;
    const normals = state.activeCloud.geometry.attributes.normal.array;
    let hasValid = false;
    for (let i = 0; i < Math.min(normals.length/3, 10); i++) {
        if (normals[i*3] !== 0 || normals[i*3+1] !== 0 || normals[i*3+2] !== 0) { hasValid = true; break; }
    }
    if (!hasValid && !state.showNormals) {
        computeNormals();
        return;
    }
    state.showNormals = !state.showNormals;
    if (state.showNormals) showNormals();
    else hideNormals();
    document.getElementById('btn-normals').classList.toggle('active', state.showNormals);
}

function showNormals() {
    hideNormals();
    if (!state.activeCloud) return;
    const cloud = state.activeCloud;
    const positions = cloud.geometry.attributes.position.array;
    const normals = cloud.geometry.attributes.normal.array;
    const count = positions.length / 3;
    let hasValid = false;
    for (let i = 0; i < Math.min(count, 10); i++) {
        if (normals[i*3] !== 0 || normals[i*3+1] !== 0 || normals[i*3+2] !== 0) { hasValid = true; break; }
    }
    if (!hasValid) { showStatus('法向量未计算，请先计算', 'warning'); return; }
    const sampleRate = Math.max(1, Math.floor(count / 8000));
    const lineCount = Math.floor(count / sampleRate);
    const linePos = new Float32Array(lineCount * 6);
    let idx = 0;
    for (let i = 0; i < count; i += sampleRate) {
        const x = positions[i*3], y = positions[i*3+1], z = positions[i*3+2];
        const nx = normals[i*3], ny = normals[i*3+1], nz = normals[i*3+2];
        linePos[idx++] = x; linePos[idx++] = y; linePos[idx++] = z;
        linePos[idx++] = x + nx * CONFIG.NORMAL_LENGTH;
        linePos[idx++] = y + ny * CONFIG.NORMAL_LENGTH;
        linePos[idx++] = z + nz * CONFIG.NORMAL_LENGTH;
    }
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
    const mat = new THREE.LineBasicMaterial({ color: CONFIG.NORMAL_COLOR, opacity: 0.6, transparent: true });
    state.normalHelpers = new THREE.LineSegments(geom, mat);
    state.normalHelpers.position.copy(cloud.mesh.position);
    state.scene.add(state.normalHelpers);
}
function hideNormals() {
    if (state.normalHelpers) {
        state.scene.remove(state.normalHelpers);
        state.normalHelpers.geometry.dispose();
        state.normalHelpers = null;
    }
}

// ============================================================
// 颜色修改
// ============================================================
function applyColor() {
    if (!state.activeCloud) return;
    const color = new THREE.Color(document.getElementById('color-picker').value);
    const colors = state.activeCloud.geometry.attributes.color.array;
    for (let i = 0; i < colors.length / 3; i++) {
        colors[i*3] = color.r;
        colors[i*3+1] = color.g;
        colors[i*3+2] = color.b;
    }
    state.activeCloud.geometry.attributes.color.needsUpdate = true;
    showStatus('颜色已应用', 'success');
}
function resetColor() {
    if (!state.activeCloud) return;
    const colors = state.activeCloud.geometry.attributes.color.array;
    colors.set(state.activeCloud.originalColors);
    state.activeCloud.geometry.attributes.color.needsUpdate = true;
    showStatus('颜色已恢复', 'success');
}

// ============================================================
// 配准
// ============================================================
function updateRegStatus() {
    const count = state.reg.correspondences.filter(p => p.tgt !== null).length;
    const srcName = state.reg.sourceUUID ?
        (state.pointClouds.get(state.reg.sourceUUID)?.filename || '已选') : '未选';
    const tgtName = state.reg.targetUUID ?
        (state.pointClouds.get(state.reg.targetUUID)?.filename || '已选') : '未选';
    const nextHint = state.reg.nextIsSource ?
        '<span style="color:#ff4444;">【下一步：在源点云上采集】</span>' :
        '<span style="color:#44ff44;">【下一步：在目标点云上采集】</span>';
    document.getElementById('reg-status').innerHTML =
        `对应点: <b>${count}</b> 对 | 源: ${srcName} | 目标: ${tgtName}<br>${nextHint}`;
    const completePairs = state.reg.correspondences.filter(p => p.tgt !== null).length;
    document.getElementById('btn-execute-reg').disabled = (completePairs < 3);
    document.getElementById('btn-icp-refine').disabled = (completePairs < 3 || !state.reg.lastTransform);
    document.getElementById('btn-add-correspondence').disabled = (completePairs === 0);
    document.getElementById('btn-undo-correspondence').disabled = (state.reg.correspondences.length === 0);
}

function setTargetCloud() {
    if (!state.activeCloud) { showStatus('请先激活一个点云', 'warning'); return; }
    if (state.reg.sourceUUID === state.activeCloud.uuid) { showStatus('目标不能与源相同', 'warning'); return; }
    state.reg.targetUUID = state.activeCloud.uuid;
    state.reg.correspondences = [];
    state.reg.nextIsSource = true;
    state.reg.lastTransform = null;
    clearRegMarkers();
    updateRegStatus();
    showStatus(`目标点云设为: ${state.activeCloud.filename}`, 'success');
}
function setSourceCloud() {
    if (!state.activeCloud) { showStatus('请先激活一个点云', 'warning'); return; }
    if (state.reg.targetUUID === state.activeCloud.uuid) { showStatus('源不能与目标相同', 'warning'); return; }
    state.reg.sourceUUID = state.activeCloud.uuid;
    state.reg.correspondences = [];
    state.reg.nextIsSource = true;
    state.reg.lastTransform = null;
    clearRegMarkers();
    updateRegStatus();
    showStatus(`源点云设为: ${state.activeCloud.filename}`, 'success');
}

function toggleRegMode() {
    if (!state.reg.sourceUUID || !state.reg.targetUUID) {
        showStatus('请先设置源和目标点云', 'warning');
        return;
    }
    state.reg.mode = !state.reg.mode;
    document.getElementById('btn-reg-mode').classList.toggle('active', state.reg.mode);
    state.renderer.domElement.style.cursor = state.reg.mode ? 'crosshair' : 'default';
    if (state.reg.mode) {
        document.getElementById('hint-text').textContent = '配准模式：交替点击源点云和目标点云采集对应点';
    } else {
        document.getElementById('hint-text').textContent = '鼠标左键旋转 | 右键平移 | 滚轮缩放';
    }
    document.getElementById('btn-exit-reg').disabled = !state.reg.mode;
}

function exitRegMode() {
    if (state.reg.mode) toggleRegMode(); // 关闭配准模式
    state.reg.mode = false;
    document.getElementById('btn-reg-mode').classList.remove('active');
    state.renderer.domElement.style.cursor = 'default';
    document.getElementById('hint-text').textContent = '鼠标左键旋转 | 右键平移 | 滚轮缩放';
    document.getElementById('btn-exit-reg').disabled = true;
}

function clearRegMarkers() {
    state.reg.tempMarkers.forEach(m => {
        if (m.geometry) m.geometry.dispose();
        if (m.material) {
            if (m.material.map) m.material.map.dispose();
            m.material.dispose();
        }
        state.scene.remove(m);
    });
    state.reg.tempMarkers = [];
}

function addTempMarker(position, color, label) {
    const markerSize = Math.max(CONFIG.REG_MARKER_SIZE, state.sceneRange * 0.0005);
    const geometry = new THREE.SphereGeometry(markerSize, 16, 16);
    const material = new THREE.MeshBasicMaterial({ color });
    const marker = new THREE.Mesh(geometry, material);
    marker.position.copy(position);
    state.scene.add(marker);
    state.reg.tempMarkers.push(marker);

    // 标签
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,128,64);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(2,2,124,60);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 32px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 64, 32);
    const texture = new THREE.CanvasTexture(canvas);
    const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
    const sprite = new THREE.Sprite(spriteMat);
    sprite.position.copy(position);
    sprite.position.y += markerSize * 3;
    sprite.scale.set(markerSize * 8, markerSize * 4, 1);
    state.scene.add(sprite);
    state.reg.tempMarkers.push(sprite);
}

function handleRegClick(event) {
    if (!state.reg.mode || !state.activeCloud) return;

    const rect = state.renderer.domElement.getBoundingClientRect();
    state.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    state.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    state.raycaster.setFromCamera(state.mouse, state.camera);
    const threshold = Math.max(1.0, state.sceneRange * 0.001);
    state.raycaster.params.Points.threshold = threshold;
    const intersects = state.raycaster.intersectObject(state.activeCloud.mesh);

    if (intersects.length === 0) {
        showStatus('未点击到点云，请精确点击特征点', 'warning');
        return;
    }

    const point = intersects[0].point.clone();
    const cloudUUID = state.activeCloud.uuid;

    // 采集源点
    if (state.reg.nextIsSource) {
        if (cloudUUID !== state.reg.sourceUUID) {
            showStatus('当前应采集源点云（红色高亮）', 'warning');
            return;
        }
        const idx = state.reg.correspondences.length; // 当前配对的索引
        state.reg.correspondences.push({ src: point, tgt: null, pairIdx: idx });
        addTempMarker(point, 0xff4444, `S${idx + 1}`);
        state.reg.nextIsSource = false;
        showStatus(`源点 ${idx + 1} 已采集，请切换到目标点云`, 'success');
    }
    // 采集目标点
    else {
        if (cloudUUID !== state.reg.targetUUID) {
            showStatus('当前应采集目标点云（绿色高亮）', 'warning');
            return;
        }
        const lastPair = state.reg.correspondences[state.reg.correspondences.length - 1];
        if (lastPair && lastPair.tgt === null) {
            lastPair.tgt = point;
            const idx = lastPair.pairIdx; // 使用存储的索引
            addTempMarker(point, 0x44ff44, `T${idx + 1}`);
            state.reg.nextIsSource = true;
            showStatus(`目标点 ${idx + 1} 已采集，配对完成！`, 'success');
        } else {
            showStatus('数据异常，请重新开始', 'error');
            clearRegistration();
            return;
        }
    }
    updateRegStatus();
}

function undoLastCorrespondence() {
    if (state.reg.correspondences.length === 0) {
        showStatus('没有可撤销的配对', 'warning');
        return;
    }
    state.reg.correspondences.pop();
    state.reg.nextIsSource = true;
    clearRegMarkers();
    // 重新绘制剩余配对
    for (let i = 0; i < state.reg.correspondences.length; i++) {
        const pair = state.reg.correspondences[i];
        addTempMarker(pair.src, 0xff4444, `S${i + 1}`);
        if (pair.tgt) {
            addTempMarker(pair.tgt, 0x44ff44, `T${i + 1}`);
        }
    }
    updateRegStatus();
    showStatus('已撤销最后一对', 'success');
}

async function addCorrespondence() {
    const completePairs = state.reg.correspondences.filter(p => p.tgt !== null);
    if (completePairs.length === 0) {
        showStatus('没有完整的点对', 'warning');
        return;
    }
    try {
        const resp = await fetch(`${API_BASE}/register_correspondences`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                src_uuid: state.reg.sourceUUID,
                tgt_uuid: state.reg.targetUUID,
                pairs: completePairs.map(p => ({
                    src_point: p.src.toArray(),
                    tgt_point: p.tgt.toArray(),
                })),
            }),
        });
        const result = await resp.json();
        if (result.error) throw new Error(result.error);
        showStatus(`已记录 ${result.count} 对对应点`, 'success');
        return result;
    } catch (err) {
        showStatus(`记录失败: ${err.message}`, 'error');
        throw err;
    }
}

async function executeRegistration() {
    if (!state.reg.sourceUUID || !state.reg.targetUUID) {
        showStatus('请先设置源和目标点云', 'warning');
        return;
    }
    const completePairs = state.reg.correspondences.filter(p => p.tgt !== null);
    if (completePairs.length < 3) {
        showStatus(`至少需要3对对应点，当前${completePairs.length}对`, 'warning');
        return;
    }
    showProgress('粗配准 (SVD)...', 0);
    try {
        await addCorrespondence();
        const parsed = await fetchCloud(`${API_BASE}/apply_registration`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                src_uuid: state.reg.sourceUUID,
                tgt_uuid: state.reg.targetUUID,
            }),
        });
        const result = parsed.meta;
        state.reg.lastTransform = result.transformation;

        await loadPointCloud(parsed, result.filename, result.uuid);
        state.reg.sourceUUID = result.uuid;

        hideProgress();
        let msg = `粗配准完成！`;
        if (result.rmse !== undefined) msg += ` RMSE: ${result.rmse.toFixed(4)}m`;
        if (result.overlap_ratio !== undefined) msg += ` 重叠率: ${(result.overlap_ratio*100).toFixed(1)}%`;
        showStatus(msg, 'success');
        updateRegStatus();
    } catch (err) {
        hideProgress();
        showStatus(`配准失败: ${err.message}`, 'error');
    }
}

async function icpRefine() {
    if (!state.reg.sourceUUID || !state.reg.targetUUID) {
        showStatus('请先设置源和目标点云', 'warning');
        return;
    }
    if (!state.reg.lastTransform) {
        showStatus('请先执行粗配准', 'warning');
        return;
    }
    showProgress('ICP 精配准中...', 0);
    try {
        const parsed = await fetchCloud(`${API_BASE}/icp_refine`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                src_uuid: state.reg.sourceUUID,
                tgt_uuid: state.reg.targetUUID,
                initial_transform: state.reg.lastTransform,
                voxel_size: parseFloat(document.getElementById('voxel-size').value) || 0.05,
            }),
        });
        const result = parsed.meta;

        await loadPointCloud(parsed, result.filename, result.uuid);
        state.reg.sourceUUID = result.uuid;
        state.reg.lastTransform = result.transformation;

        hideProgress();
        let msg = `ICP 精配准完成！`;
        if (result.inlier_rmse !== undefined) msg += ` 内点RMSE: ${result.inlier_rmse.toFixed(4)}m`;
        if (result.fitness !== undefined) msg += ` 拟合度: ${(result.fitness*100).toFixed(1)}%`;
        showStatus(msg, 'success');
        updateRegStatus();
    } catch (err) {
        hideProgress();
        showStatus(`ICP 失败: ${err.message}`, 'error');
    }
}

function clearRegistration() {
    state.reg.correspondences = [];
    state.reg.nextIsSource = true;
    state.reg.lastTransform = null;
    clearRegMarkers();
    updateRegStatus();
    showStatus('已清除所有配准数据', 'info');
}

// ============================================================
// 保存配准结果
// ============================================================
async function saveRegistered() {
    if (!state.activeCloud) {
        showStatus('请先激活一个点云', 'warning');
        return;
    }

    // 检查是否在配准状态（源和目标都已设置）
    if (!state.reg.sourceUUID || !state.reg.targetUUID) {
        showStatus('未找到配准关系，请先执行配准', 'warning');
        return;
    }

    showProgress('合并并保存点云...', 0);
    try {
        // 1. 调用合并接口
        const mergeResp = await fetch(`${API_BASE}/merge_clouds`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                uuid1: state.reg.sourceUUID,
                uuid2: state.reg.targetUUID,
            }),
        });
        const mergeResult = await mergeResp.json();
        if (mergeResult.error) throw new Error(mergeResult.error);

        // 2. 保存合并后的点云
        const filename = `merged_${Date.now()}.ply`;
        const saveResp = await fetch(`${API_BASE}/save_registered`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                uuid: mergeResult.uuid,
                filename: filename,
            }),
        });
        const saveResult = await saveResp.json();
        if (saveResult.error) throw new Error(saveResult.error);

        hideProgress();
        showStatus(`融合点云已保存，总点数: ${saveResult.points}`, 'success');
        // 自动下载
        const a = document.createElement('a');
        a.href = `${API_BASE}/download/${filename}`;
        a.download = filename;
        a.click();
    } catch (err) {
        hideProgress();
        showStatus(`保存融合点云失败: ${err.message}`, 'error');
    }
}
// ============================================================
// 工具函数
// ============================================================
function showStatus(message, type='info') {
    const bar = document.getElementById('status-bar');
    bar.className = `status-bar ${type}`;
    bar.innerHTML = type === 'loading' ? `<div class="spinner"></div><span>${message}</span>` : `<span>${message}</span>`;
}
function showProgress(title, percent) {
    document.getElementById('progress-title').textContent = title;
    document.getElementById('progress-fill').style.width = `${percent}%`;
    document.getElementById('progress-text').textContent = `${Math.round(percent)}%`;
    document.getElementById('progress-overlay').classList.add('show');
}
function updateProgress(percent) {
    document.getElementById('progress-fill').style.width = `${percent}%`;
    document.getElementById('progress-text').textContent = `${Math.round(percent)}%`;
}
function hideProgress() {
    document.getElementById('progress-overlay').classList.remove('show');
}
function updateButtonState(enabled) {
    ['btn-denoise','btn-normals','btn-bbox','btn-clear','btn-apply-color','btn-reset-color','btn-set-target','btn-set-source','btn-reg-mode'].forEach(id => {
        document.getElementById(id).disabled = !enabled;
    });
    document.getElementById('btn-exit-reg').disabled = true;
    document.getElementById('btn-add-correspondence').disabled = true;
    document.getElementById('btn-execute-reg').disabled = true;
    document.getElementById('btn-icp-refine').disabled = true;
    document.getElementById('btn-undo-correspondence').disabled = true;
    document.getElementById('btn-save-reg').disabled = !enabled;
}
function updateToolbarState() {
    document.getElementById('tb-rotate').classList.add('active');
}
function resetView() {
    if (!state.activeCloud) {
        state.camera.position.set(100, 100, 100);
        state.controls.target.set(0, 0, 0);
    } else {
        focusOnCloud(state.activeCloud.uuid);
    }
    state.controls.update();
    saveCameraState();
}
function takeScreenshot() {
    state.renderer.render(state.scene, state.camera);
    const link = document.createElement('a');
    link.download = `pointcloud_${Date.now()}.png`;
    link.href = state.renderer.domElement.toDataURL('image/png');
    link.click();
    showStatus('截图已保存', 'success');
}

// ============================================================
// 事件绑定
// ============================================================
function bindEvents() {
    window.addEventListener('resize', () => {
        const container = document.getElementById('canvas-container');
        state.camera.aspect = container.clientWidth / container.clientHeight;
        state.camera.updateProjectionMatrix();
        state.renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // 上传
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.ply'));
        if (files.length) uploadFiles(files);
    });
    fileInput.addEventListener('change', e => {
        if (e.target.files.length) uploadFiles(Array.from(e.target.files));
    });

    // 滑块
    document.getElementById('voxel-size').addEventListener('input', e => {
        document.getElementById('voxel-value').textContent = e.target.value;
    });
    document.getElementById('point-size').addEventListener('input', e => {
        state.pointSizeScale = parseFloat(e.target.value);
        document.getElementById('point-size-value').textContent = parseFloat(e.target.value).toFixed(2);
        state.pointClouds.forEach(cloud => {
            cloud.mesh.material.size = cloud.adaptiveSize * state.pointSizeScale;
        });
    });

    // 按钮
    document.getElementById('btn-denoise').addEventListener('click', denoise);
    document.getElementById('btn-normals').addEventListener('click', toggleNormals);
    document.getElementById('btn-bbox').addEventListener('click', toggleBoundingBox);
    document.getElementById('btn-save-reg').addEventListener('click', saveRegistered);
    document.getElementById('btn-clear').addEventListener('click', clearAll);
    document.getElementById('btn-reset-view').addEventListener('click', resetView);
    document.getElementById('btn-apply-color').addEventListener('click', applyColor);
    document.getElementById('btn-reset-color').addEventListener('click', resetColor);

    document.querySelectorAll('.color-preset').forEach(preset => {
        preset.addEventListener('click', () => {
            document.getElementById('color-picker').value = preset.dataset.color;
        });
    });

    // 工具栏
    document.getElementById('tb-rotate').addEventListener('click', () => {
        state.controls.enableRotate = true;
        state.controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
        document.getElementById('tb-rotate').classList.add('active');
        document.getElementById('tb-pan').classList.remove('active');
        document.getElementById('tb-zoom').classList.remove('active');
    });
    document.getElementById('tb-pan').addEventListener('click', () => {
        state.controls.enableRotate = false;
        state.controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
        document.getElementById('tb-rotate').classList.remove('active');
        document.getElementById('tb-pan').classList.add('active');
        document.getElementById('tb-zoom').classList.remove('active');
    });
    document.getElementById('tb-zoom').addEventListener('click', () => {
        state.controls.enableZoom = true;
        document.getElementById('tb-zoom').classList.add('active');
    });
    document.getElementById('tb-grid').addEventListener('click', () => {
        state.gridHelper.visible = !state.gridHelper.visible;
        document.getElementById('tb-grid').classList.toggle('active', state.gridHelper.visible);
    });
    document.getElementById('tb-axes').addEventListener('click', () => {
        state.axesHelper.visible = !state.axesHelper.visible;
        document.getElementById('tb-axes').classList.toggle('active', state.axesHelper.visible);
    });
    document.getElementById('tb-screenshot').addEventListener('click', takeScreenshot);
    document.getElementById('tb-fullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });

    // 配准
    document.getElementById('btn-set-target').addEventListener('click', setTargetCloud);
    document.getElementById('btn-set-source').addEventListener('click', setSourceCloud);
    document.getElementById('btn-reg-mode').addEventListener('click', toggleRegMode);
    document.getElementById('btn-exit-reg').addEventListener('click', exitRegMode);
    document.getElementById('btn-add-correspondence').addEventListener('click', addCorrespondence);
    document.getElementById('btn-undo-correspondence').addEventListener('click', undoLastCorrespondence);
    document.getElementById('btn-execute-reg').addEventListener('click', executeRegistration);
    document.getElementById('btn-icp-refine').addEventListener('click', icpRefine);

    // 鼠标点击（只处理配准模式）
    state.renderer.domElement.addEventListener('click', (e) => {
        if (state.reg.mode) handleRegClick(e);
    });

    // 键盘
    document.addEventListener('keydown', (e) => {
        switch (e.key.toLowerCase()) {
            case 'r': document.getElementById('tb-rotate').click(); break;
            case 'p': document.getElementById('tb-pan').click(); break;
            case 'g': document.getElementById('tb-grid').click(); break;
            case 'a': document.getElementById('tb-axes').click(); break;
            case 'c': takeScreenshot(); break;
            case 'f': document.getElementById('tb-fullscreen').click(); break;
            case 'z': if (state.reg.mode) undoLastCorrespondence(); break;
            case 'escape':
                if (state.reg.mode) exitRegMode();
                break;
        }
    });
}

// ============================================================
// 动画循环
// ============================================================
function animate() {
    requestAnimationFrame(animate);
    state.controls.update();
    state.renderer.render(state.scene, state.camera);
    if (!state._fpsLastTime) state._fpsLastTime = performance.now();
    if (!state._fpsCount) state._fpsCount = 0;
    state._fpsCount++;
    const now = performance.now();
    if (now - state._fpsLastTime >= CONFIG.FPS_INTERVAL) {
        const fps = Math.round((state._fpsCount * 1000) / (now - state._fpsLastTime));
        document.getElementById('fps-counter').textContent = `FPS: ${fps}`;
        state._fpsCount = 0;
        state._fpsLastTime = now;
    }
}

// ============================================================
// 启动
// ============================================================
initScene();
</script>
