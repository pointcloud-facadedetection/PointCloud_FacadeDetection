            } else {
                hint.textContent = '鼠标左键旋转 | 右键平移 | 滚轮缩放';
            }
        }

        function takeScreenshot() {
            state.renderer.render(state.scene, state.camera);
            const link = document.createElement('a');
            link.download = `pointcloud_${Date.now()}.png`;
            link.href = state.renderer.domElement.toDataURL('image/png');
            link.click();
            showStatus('截图已保存', 'success');
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        function bindEvents() {
            window.addEventListener('resize', () => {
                const container = document.getElementById('canvas-container');
                state.camera.aspect = container.clientWidth / container.clientHeight;
                state.camera.updateProjectionMatrix();
                state.renderer.setSize(container.clientWidth, container.clientHeight);
            });

            // 文件上传
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            dropZone.addEventListener('click', () => fileInput.click());
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const files = Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.ply'));
                if (files.length) uploadFiles(files);
            });
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length) uploadFiles(Array.from(e.target.files));
            });

            // 滑块
            document.getElementById('voxel-size').addEventListener('input', (e) => {
                document.getElementById('voxel-value').textContent = e.target.value;
            });
            document.getElementById('point-size').addEventListener('input', (e) => {
                state.pointSizeScale = parseFloat(e.target.value);
                document.getElementById('point-size-value').textContent = e.target.value;
                updatePointSize();
            });

            // 基本操作按钮
            document.getElementById('btn-denoise').addEventListener('click', denoise);
            document.getElementById('btn-normals').addEventListener('click', toggleNormals);
            document.getElementById('btn-bbox').addEventListener('click', toggleBoundingBox);
            document.getElementById('btn-save-reg').addEventListener('click', saveRegistered);
            document.getElementById('btn-clear').addEventListener('click', clearAll);
            document.getElementById('btn-reset-view').addEventListener('click', resetView);
            document.getElementById('btn-apply-color').addEventListener('click', applyColor);
            document.getElementById('btn-reset-color').addEventListener('click', resetColor);
            document.getElementById('btn-clear-selection').addEventListener('click', clearSelection);

            // 颜色预设
            document.querySelectorAll('.color-preset').forEach(preset => {
                preset.addEventListener('click', () => {
                    document.getElementById('color-picker').value = preset.dataset.color;
                });
            });

            // 工具栏
            document.getElementById('tb-rotate').addEventListener('click', () => {
                state.controls.enableRotate = true;
                state.controls.mouseButtons = {
                    LEFT: THREE.MOUSE.ROTATE,
                    MIDDLE: THREE.MOUSE.DOLLY,
                    RIGHT: THREE.MOUSE.PAN
                };
                document.getElementById('tb-rotate').classList.add('active');
                document.getElementById('tb-pan').classList.remove('active');
                document.getElementById('tb-zoom').classList.remove('active');
            });
            document.getElementById('tb-pan').addEventListener('click', () => {
                state.controls.enableRotate = false;
                state.controls.mouseButtons = {
                    LEFT: THREE.MOUSE.PAN,
                    MIDDLE: THREE.MOUSE.DOLLY,
                    RIGHT: THREE.MOUSE.ROTATE
                };
                document.getElementById('tb-rotate').classList.remove('active');
                document.getElementById('tb-pan').classList.add('active');
                document.getElementById('tb-zoom').classList.remove('active');
            });
            document.getElementById('tb-zoom').addEventListener('click', () => {
                state.controls.enableZoom = true;
                document.getElementById('tb-zoom').classList.add('active');
            });
            document.getElementById('tb-select').addEventListener('click', toggleSelectMode);
            document.getElementById('tb-measure').addEventListener('click', toggleMeasureMode);
            document.getElementById('tb-grid').addEventListener('click', () => {
                state.gridHelper.visible = !state.gridHelper.visible;
                document.getElementById('tb-grid').classList.toggle('active', state.gridHelper.visible);
            });
            document.getElementById('tb-axes').addEventListener('click', () => {
                state.axesHelper.visible = !state.axesHelper.visible;
                document.getElementById('tb-axes').classList.toggle('active', state.axesHelper.visible);
            });
            document.getElementById('tb-screenshot').addEventListener('click', takeScreenshot);
            document.getElementById('tb-fullscreen').addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            });

            // 配准相关按钮
            document.getElementById('btn-set-target').addEventListener('click', setTargetCloud);
            document.getElementById('btn-set-source').addEventListener('click', setSourceCloud);
            document.getElementById('btn-reg-mode').addEventListener('click', toggleRegMode);
            document.getElementById('btn-add-correspondence').addEventListener('click', addCorrespondence);
            document.getElementById('btn-execute-reg').addEventListener('click', executeRegistration);
            document.getElementById('btn-icp-refine').addEventListener('click', icpRefine);

            // 鼠标点击事件（统一处理，优先级：配准 > 选择 > 测量）
            state.renderer.domElement.addEventListener('click', (e) => {
                if (state.reg.mode) {
                    handleRegClick(e);
                    return;
                }
                if (state.selectMode) {
                    selectPoint(e);
                    return;
                }
                if (state.measureMode) {
                    addMeasurePoint(e);
                    return;
                }
            });

            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                switch (e.key.toLowerCase()) {
                    case 'r':
                        document.getElementById('tb-rotate').click();
                        break;
                    case 'p':
                        document.getElementById('tb-pan').click();
                        break;
                    case 's':
                        if (!state.reg.mode) toggleSelectMode();
                        break;
                    case 'm':
                        if (!state.reg.mode) toggleMeasureMode();
                        break;
                    case 'g':
                        document.getElementById('tb-grid').click();
                        break;
                    case 'a':
                        document.getElementById('tb-axes').click();
                        break;
                    case 'c':
                        takeScreenshot();
                        break;
                    case 'f':
                        document.getElementById('tb-fullscreen').click();
                        break;
                    case 'z':
                        if (state.reg.mode) undoLastCorrespondence();
                        break;
                    case 'escape':
                        if (state.reg.mode) {
                            toggleRegMode();
                        } else if (state.selectMode) {
                            clearSelection();
                            toggleSelectMode();
                        } else if (state.measureMode) {
                            clearMeasure();
                            toggleMeasureMode();
                        } else {
                            if (state.selectedPoint) clearSelection();
                        }
                        break;
                }
            });
        }

        // ============================================================
        // 渲染循环
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            state.controls.update();
            state.renderer.render(state.scene, state.camera);

            if (!state._fpsLastTime) state._fpsLastTime = performance.now();
            if (!state._fpsCount) state._fpsCount = 0;
            state._fpsCount++;
            const now = performance.now();
            if (now - state._fpsLastTime >= CONFIG.FPS_INTERVAL) {
                const fps = Math.round((state._fpsCount * 1000) / (now - state._fpsLastTime));
                document.getElementById('fps-counter').textContent = `FPS: ${fps}`;
                state._fpsCount = 0;
                state._fpsLastTime = now;
            }
        }

        // ============================================================
        // 启动
        // ============================================================
        initScene();
    </script>

</body>
</html>
